[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

# Pages that moved in the Astro rebuild (2026-10)
[[redirects]]
from = "/about/"
to = "/#about"
status = 301

[[redirects]]
from = "/contact/"
to = "/#contact"
status = 301

[[redirects]]
from = "/posts/2020-12-01-r-rmarkdown/*"
to = "/projects/fast-food-nutrition/"
status = 301

[[redirects]]
from = "/tags/*"
to = "/posts/"
status = 301

[[redirects]]
from = "/categories/*"
to = "/posts/"
status = 301

[[redirects]]
from = "/authors/*"
to = "/"
status = 301

[[redirects]]
from = "/series/*"
to = "/posts/"
status = 301

# Old addresses from before the 2026-09 cleanup
[[redirects]]
from = "/post/11.13-kenpom/*"
to = "/posts/kenpom-11.13/"
status = 301

[[redirects]]
from = "/post/*"
to = "/posts/"
status = 301

[[redirects]]
from = "/Joel-Resume-website%20.pdf"
to = "/Joel-Resume.pdf"
status = 301

[[redirects]]
from = "/about-us/*"
to = "/#about"
status = 301

[[redirects]]
from = "/about-hugo/*"
to = "/#about"
status = 301
